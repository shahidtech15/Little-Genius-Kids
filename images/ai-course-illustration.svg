<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="aiCourseTitle aiCourseDesc">
  <title id="aiCourseTitle">Kids Learning Artificial Intelligence and Coding</title>
  <desc id="aiCourseDesc">Original illustration of a friendly robot, logic blocks, neural network nodes, and playful stars representing beginner AI education for children.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="botBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="640" height="420" rx="32" fill="url(#bgGrad)"/>

  <!-- Decorative Soft Circles -->
  <circle cx="96" cy="86" r="46" fill="#FBBF24" opacity="0.24"/>
  <circle cx="556" cy="328" r="58" fill="#38BDF8" opacity="0.22"/>
  <circle cx="520" cy="76" r="28" fill="#FB7185" opacity="0.22"/>

  <!-- Neural Network Connections (Left Side) -->
  <g stroke="#7C3AED" stroke-width="3" opacity="0.45">
    <line x1="88" y1="150" x2="176" y2="122"/>
    <line x1="88" y1="150" x2="176" y2="195"/>
    <line x1="88" y1="230" x2="176" y2="122"/>
    <line x1="88" y1="230" x2="176" y2="195"/>
    <line x1="88" y1="230" x2="176" y2="266"/>
    <line x1="176" y1="122" x2="255" y2="195"/>
    <line x1="176" y1="195" x2="255" y2="195"/>
    <line x1="176" y1="266" x2="255" y2="195"/>
  </g>
  <g>
    <circle cx="88" cy="150" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="88" cy="230" r="14" fill="#34D399" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="176" cy="122" r="14" fill="#FBBF24" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="176" cy="195" r="14" fill="#FB7185" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="176" cy="266" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Friendly AI Robot (Center) -->
  <g transform="translate(245, 76)">
    <!-- Antenna -->
    <line x1="85" y1="0" x2="85" y2="24" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="85" cy="-4" r="10" fill="#FBBF24" stroke="#1E293B" stroke-width="3"/>
    <!-- Ears -->
    <rect x="0" y="54" width="16" height="36" rx="8" fill="#38BDF8" stroke="#1E293B" stroke-width="3"/>
    <rect x="154" y="54" width="16" height="36" rx="8" fill="#38BDF8" stroke="#1E293B" stroke-width="3"/>
    <!-- Head -->
    <rect x="16" y="22" width="138" height="96" rx="26" fill="url(#botBody)" stroke="#1E293B" stroke-width="4"/>
    <!-- Visor -->
    <rect x="32" y="42" width="106" height="54" rx="16" fill="url(#screenGrad)"/>
    <!-- Eyes & Smile -->
    <circle cx="62" cy="64" r="9" fill="#38BDF8"/>
    <circle cx="108" cy="64" r="9" fill="#38BDF8"/>
    <circle cx="65" cy="61" r="3" fill="#FFFFFF"/>
    <circle cx="111" cy="61" r="3" fill="#FFFFFF"/>
    <path d="M 70 80 Q 85 90 100 80" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
    <!-- Torso -->
    <rect x="28" y="126" width="114" height="94" rx="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
    <rect x="46" y="144" width="78" height="44" rx="10" fill="#E0F2FE"/>
    <!-- Mini Chart Bars Inside Chest -->
    <rect x="58" y="168" width="12" height="14" rx="3" fill="#7C3AED"/>
    <rect x="78" y="158" width="12" height="24" rx="3" fill="#34D399"/>
    <rect x="98" y="152" width="12" height="30" rx="3" fill="#FB7185"/>
    <!-- Arms -->
    <rect x="-12" y="138" width="32" height="18" rx="9" fill="#FBBF24" stroke="#1E293B" stroke-width="3"/>
    <rect x="150" y="138" width="32" height="18" rx="9" fill="#FBBF24" stroke="#1E293B" stroke-width="3"/>
  </g>

  <!-- Floating Coding & Logic Cards (Right Side) -->
  <g transform="translate(442, 118)">
    <rect x="0" y="0" width="154" height="58" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="14" y="14" width="42" height="12" rx="6" fill="#7C3AED"/>
    <rect x="64" y="14" width="68" height="12" rx="6" fill="#38BDF8"/>
    <rect x="14" y="34" width="96" height="10" rx="5" fill="#CBD5E1"/>
  </g>

  <g transform="translate(454, 196)">
    <rect x="0" y="0" width="144" height="58" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="3"/>
    <circle cx="24" cy="29" r="12" fill="#34D399"/>
    <path d="M 19 29 L 23 33 L 30 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="18" width="78" height="10" rx="5" fill="#1E293B" opacity="0.8"/>
    <rect x="46" y="34" width="54" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Bottom Desk / Banner -->
  <rect x="64" y="330" width="512" height="44" rx="22" fill="#1E293B"/>
  <circle cx="104" cy="352" r="8" fill="#FB7185"/>
  <circle cx="132" cy="352" r="8" fill="#FBBF24"/>
  <circle cx="160" cy="352" r="8" fill="#34D399"/>
  <text x="348" y="358" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">THINK • CODE • EXPLORE AI</text>

  <!-- Playful Stars -->
  <path d="M 218 68 L 223 80 L 236 81 L 226 89 L 229 102 L 218 95 L 207 102 L 210 89 L 200 81 L 213 80 Z" fill="#FBBF24"/>
  <path d="M 432 62 L 436 71 L 446 72 L 438 78 L 441 88 L 432 82 L 423 88 L 426 78 L 418 72 L 428 71 Z" fill="#FB7185"/>
</svg>
