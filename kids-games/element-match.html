    <meta charset="UTF-8">
    <title>Element Match Game - Kids Games World</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container { 
            max-width: 800px; 
            margin: 2rem auto; 
            padding: 2rem; 
            background: rgba(0,0,0,0.15); 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        }
        .grid { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            margin-bottom: 2rem; 
            gap: 15px; 
        }
        .card { 
            padding: 20px 30px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 15px; 
            cursor: pointer; 
            font-size: 1.5rem; 
            border: 2px solid transparent; 
            font-weight: bold; 
            color: white;
            transition: all 0.3s;
        }
        .card:hover { transform: scale(1.05); background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.5); }
        .card.selected { background: #ffcc00; color: #333; transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 204, 0, 0.6); border-color: #fff; }
        .card.correct { background: #4CAF50; color: white; opacity: 0.3; pointer-events: none; transform: scale(0.95); }
        .card.wrong { animation: shake 0.4s; background: #FF5252; color: white; }
        
        .nav-back {
            display: inline-block;
            margin-top: 10px;
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .nav-back:hover { color: #fff; transform: translateX(-5px); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>🧪 Element Match</h1>
        <a href="index.html" class="nav-back">◀ Back to Hub</a>
    </header>

    <div class="game-container">
        <h2>Match the Chemical Symbol to its Name!</h2>
        <h3 id="scoreDisplay" style="color: #ffcc00; font-size: 2rem;">Score: 0</h3>
        
        <p>Step 1: Select a Symbol</p>
        <div class="grid" id="symbolsGrid"></div>
        
        <hr style="border: 1px dashed rgba(255,255,255,0.3); margin: 30px 0;">
        
        <p>Step 2: Find the matching Name</p>
        <div class="grid" id="namesGrid"></div>
    </div>

    <!-- We map this snippet directly into your requested quiz.js scaffold! -->

</body>
